architectury {
	platformSetupLoomIde()
	fabric()
}

configurations {
	developmentFabric.extendsFrom common
}

version = rootProject.mod_version + "-fabric-" + rootProject.minecraft_version

dependencies {
	implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	api("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}

	implementation("com.terraformersmc:modmenu:${project.modmenu_version}")

	// TODO
//	compileOnly "maven.modrinth:charm:${project.charm_version}"
//	compileOnly "maven.modrinth:spectrum:${project.spectrum_version}"

	common(project(path: ':common')) { transitive = false }
	shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}
