repositories {
	maven { url = "https://maven.neoforged.net/releases/" }
}

dependencies {
	neoForge "net.neoforged:neoforge:${project.neoforge_version}"

	compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"))
	implementation(include("io.github.llamalad7:mixinextras-neoforge:${project.mixinextras_version}"))

	modApi "me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}"

	modCompileOnly "maven.modrinth:dis-enchanting-table:${project.dis_enchanting_table_version}"

	common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
	shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}
